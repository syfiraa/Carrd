<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #ffffff;
    --card: #ffffff;
    --window: #ececec;
    --body: #ffffff;
    --text: #555555;
    --muted: #b5b5b5;
    --hl: #e2e2e2;
    --border: #e4e4e4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: "Inconsolata", ui-monospace, Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 14px;
  }

  /* kartu luar */
  .card {
    width: 100%; max-width: 560px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .footer { margin-top: 22px; padding-left: 4px; color: var(--muted); font-size: 18px; }
  .footer a { color: inherit; text-decoration: none; }
  .reopen {
    display: none; margin: 4px auto 0; padding: 8px 18px;
    border-radius: 999px; border: 1px solid var(--border);
    background: #fff; color: var(--text);
    font: inherit; font-size: 15px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }

  /* jendela */
  .window {
    background: var(--window);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .window.hidden { display: none; }
  .titlebar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px;
  }
  .player {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    background: #fff; border-radius: 999px;
    padding: 6px 14px 6px 10px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
    cursor: pointer; user-select: none;
  }
  .player svg { flex: none; width: 24px; height: 24px; fill: #666; }
  .marquee { flex: 1; overflow: hidden; white-space: nowrap; text-align: center; font-size: 17px; }
  .marquee span { display: inline-block; }
  .playing .marquee span { animation: scroll 9s linear infinite; padding-left: 100%; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  .wbtn {
    flex: none; width: 32px; height: 32px;
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    color: #666; font: inherit; font-size: 20px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .wbtn:active { background: #f3f3f3; }

  .content {
    display: flex; background: var(--body);
    min-height: 190px;
    border-top: 1px solid var(--border);
  }
  .content.collapsed { display: none; }
  .photo {
    flex: 0 0 56%;
    background-size: cover; background-position: center;
    background-color: #ddd;
    background-image: linear-gradient(135deg, #cfc9d4, #e9e4ee 50%, #d7dde4);
    -webkit-mask-image: linear-gradient(to right, #000 55%, transparent 100%);
            mask-image: linear-gradient(to right, #000 55%, transparent 100%);
  }
  .info {
    flex: 1; padding: 18px 16px 16px 0; margin-left: -6%;
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 17px; line-height: 1.55; position: relative;
  }
  .info p + p { margin-top: 2px; }
  .info mark { background: var(--hl); color: inherit; padding: 0 3px; }
  .btn {
    align-self: center; margin-top: 12px;
    padding: 6px 22px; border-radius: 999px;
    background: #fff; border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
    color: var(--text); font: inherit; font-size: 17px; cursor: pointer;
  }
  .btn:active { transform: translateY(1px); }

  /* popup more info */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(255,255,255,.65);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.open { display: flex; }
  .overlay .window { width: 100%; max-width: 440px; box-shadow: 0 8px 30px rgba(0,0,0,.15); }
  .overlay .titlebar .ttl { flex: 1; font-size: 17px; padding-left: 6px; }
  .overlay .modal-body {
    background: var(--body); padding: 18px; font-size: 17px; line-height: 1.6;
    max-height: 60vh; overflow-y: auto; border-top: 1px solid var(--border);
  }
  .modal-body p + p { margin-top: 10px; }
  .modal-body mark { background: var(--hl); color: inherit; padding: 0 3px; }
  .modal-body a { color: inherit; }

  @media (max-width: 480px) {
    .card { padding: 14px; border-radius: 16px; }
    .titlebar { gap: 10px; padding: 8px 10px; }
    .content { min-height: 170px; }
    .info, .marquee, .btn { font-size: 15px; }
    .footer { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="window" id="win">
    <div class="titlebar">
      <div class="player" id="player">
        <svg id="icon" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>
        <div class="marquee"><span id="songText"></span></div>
      </div>
      <button class="wbtn" id="minBtn" aria-label="minimize">&#8212;</button>
      <button class="wbtn" id="closeBtn" aria-label="close">&#215;</button>
    </div>
    <div class="content" id="content">
      <div class="photo" id="photo"></div>
      <div class="info">
        <div id="infoLines"></div>
        <button class="btn" id="moreBtn"></button>
      </div>
    </div>
  </div>
  <button class="reopen" id="reopen">( buka lagi )</button>
  <div class="footer" id="footer"></div>
</div>

<!-- popup more info -->
<div class="overlay" id="overlay">
  <div class="window">
    <div class="titlebar">
      <div class="ttl" id="modalTitle"></div>
      <button class="wbtn" id="modalClose" aria-label="close">&#215;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* =====================================================
   ✏️  EDIT BAGIAN INI SAJA
   - Boleh pakai tag HTML di teks: <b>tebal</b>, <i>miring</i>,
     <u>garis bawah</u>, <mark>stabilo</mark>, <a href="...">link</a>
   ===================================================== */
const CONFIG = {
  pageTitle: "my page",

  // Lagu. file = nama file mp3 di folder yang sama (misal "lagu.mp3").
  // Kosongkan "" kalau belum punya (tombol play tetap jalan tapi tanpa suara).
  song: { title: "Merry Christmas, Please dont call.", artist: "Bleachers", file: "tmpq4de1699.mp3" },

  // Gambar kiri (URL atau nama file, misal "foto.jpg"). "" = pakai warna pastel.
  image: "megumi.jpg",

  // Teks di sebelah kanan, satu baris per item
  info: [
    "<b><i>Syafira</i></b>, fira, <mark>18</mark>, <u><i>they / them</i></u>, <b>infp</b>,",
    "<i>✦ 11/13</i>",
    "✦ i ♥ <mark>Hello</mark>"
  ],

  moreInfoButton: "writing",
  moreInfo: {
    title: "more info",
    html: `
      <p>Writer who's now studying CS ✦</p>
      <p><mark>Menulis</mark>Licentia Poetica</p>
      <p>Find me on <a href="https://discord.gg/aB4VXvrg" target="_blank" rel="noopener">discord</a>.</p>
    `
  },

  footer: "( made with love )",

  // Warna (kode hex)
  colors: {
    page: "#ffffff",      // latar belakang halaman
    card: "#ffffff",      // kartu luar
    window: "#ececec",    // bar jendela
    text: "#555555",
    highlight: "#e2e2e2"  // warna stabilo <mark>
  }
};
/* ===================================================== */

(function () {
  const c = CONFIG, $ = id => document.getElementById(id);
  const root = document.documentElement.style;
  document.title = c.pageTitle;
  root.setProperty("--page", c.colors.page);
  root.setProperty("--card", c.colors.card);
  root.setProperty("--window", c.colors.window);
  root.setProperty("--text", c.colors.text);
  root.setProperty("--hl", c.colors.highlight);

  $("songText").textContent = c.song.title + (c.song.artist ? " by " + c.song.artist : "");
  if (c.image) $("photo").style.backgroundImage = `url("${c.image}")`;
  $("infoLines").innerHTML = c.info.map(l => `<p>${l}</p>`).join("");
  $("moreBtn").textContent = c.moreInfoButton;
  $("modalTitle").textContent = c.moreInfo.title;
  $("modalBody").innerHTML = c.moreInfo.html;
  $("footer").textContent = c.footer;

  /* musik */
  const audio = new Audio();
  if (c.song.file) { audio.src = c.song.file; audio.loop = true; }
  const player = $("player"), icon = $("icon");
  const PLAY = '<path d="M6 4l14 8-14 8z"/>';
  const PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  let playing = false;
  function setPlaying(v) {
    playing = v;
    icon.innerHTML = v ? PAUSE : PLAY;
    player.classList.toggle("playing", v);
    if (c.song.file) { v ? audio.play().catch(() => {}) : audio.pause(); }
  }
  player.addEventListener("click", () => setPlaying(!playing));

  /* tombol jendela */
  $("minBtn").addEventListener("click", () => $("content").classList.toggle("collapsed"));
  $("closeBtn").addEventListener("click", () => {
    setPlaying(false);
    $("win").classList.add("hidden");
    $("reopen").style.display = "block";
  });
  $("reopen").addEventListener("click", () => {
    $("win").classList.remove("hidden");
    $("reopen").style.display = "none";
  });

  /* popup */
  const ov = $("overlay");
  $("moreBtn").addEventListener("click", () => ov.classList.add("open"));
  $("modalClose").addEventListener("click", () => ov.classList.remove("open"));
  ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("open"); });
})();
</script>
</body>
</html>
